services:
  # Patchworks Autonomous Code-Repair Workbench
  # Unified production service serving both FastAPI API endpoints and the compiled React frontend
  - type: web
    name: patchworks-workbench
    runtime: python
    plan: free
    region: oregon
    buildCommand: ./build.sh
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_BASE_URL
        value: https://api.studio.nebius.ai/v1/
      - key: NEBIUS_MODEL_NAME
        value: nvidia/Nemotron-3_5-Lightning
      - key: NEBIUS_TIMEOUT
        value: "90.0"
      - key: CORS_ORIGINS
        value: "*"
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_TOKEN
        sync: false
